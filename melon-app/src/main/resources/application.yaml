server:
  port: ${SERVER_PORT:8088}
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: melonpaw-company
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  output:
    ansi:
      enabled: always
  codec:
    max-in-memory-size: 50MB

melon:
  home_dir: ${MELON_HOME:~/.melonAI}
  execution:
    # Keep production fail-closed. IDEA development should enable the `local`
    # Spring profile from application-local.yaml.
    sandbox-mode: ${MELON_EXECUTION_SANDBOX:docker}
  enterprise:
    database-path: ${MELON_ENTERPRISE_DATABASE_PATH:}
    auth:
      token-ttl-hours: ${MELON_TOKEN_TTL_HOURS:12}
      bootstrap-token: ${MELON_BOOTSTRAP_TOKEN:}
    cors:
      allowed-origins: ${MELON_ALLOWED_ORIGINS:http://127.0.0.1:8088,http://localhost:8088,http://127.0.0.1:5173,http://localhost:5173}

logging:
  level:
    com.melon: INFO
    io.agentscope: INFO
