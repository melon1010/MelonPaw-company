spring:
  config:
    activate:
      # local：Java、Agent Shell 和 StdIO MCP 全部在宿主机运行。
      on-profile: local

server:
  # 本机开发只监听回环地址，不对局域网开放。
  address: ${SERVER_ADDRESS:127.0.0.1}

melon:
  # 两种宿主机启动方式共用同一个数据目录，切换沙箱模式不会切换用户数据。
  home_dir: ${MELON_HOME:${user.home}/.melonPaw-CompanyAI}
  execution:
    # 仅用于可信开发环境，模型执行的文件和命令工具可直接访问宿主机。
    sandbox-mode: ${MELON_EXECUTION_SANDBOX:local}
    mcp:
      # local Profile 默认让 StdIO MCP 也在宿主机运行；可设为 disabled 单独关闭。
      stdio-mode: ${MELON_MCP_STDIO_MODE:local}
