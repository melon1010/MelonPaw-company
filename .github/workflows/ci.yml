name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  console:
    name: Web console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install
        working-directory: console
        run: npm ci
      - name: Test
        working-directory: console
        run: npm run test:run
      - name: Build
        working-directory: console
        run: npm run build

  java:
    name: Java (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn -B test

  sandbox-image:
    name: Docker sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -t melonpaw-company-sandbox:ci docker/sandbox
      - name: Verify sandbox runtime
        run: >-
          docker run --rm melonpaw-company-sandbox:ci sh -lc
          'test "$(id -u)" = "10001" && test "$(pwd)" = "/workspace"
          && python --version && curl --version && git --version && node --version'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify AgentScope tool execution in Docker
        env:
          MELON_DOCKER_INTEGRATION: "true"
          MELON_SANDBOX_IMAGE: melonpaw-company-sandbox:ci
        run: >-
          mvn -B -pl melon-app -am
          -Dtest=DockerSandboxIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test
